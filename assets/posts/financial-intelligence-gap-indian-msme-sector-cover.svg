x="162" y="290"/><use href="#c" x="232" y="290"/><use href="#c" x="442" y="290"/><use href="#c" x="92" y="330"/><use href="#c" x="162" y="330"/><use href="#c" x="302" y="330"/><use href="#c" x="442" y="330"/><use href="#c" x="232" y="370"/><use href="#c" x="302" y="370"/><use href="#c" x="442" y="370"/><use href="#c" x="512" y="370"/><use href="#c" x="442" y="410"/><use href="#c" x="512" y="410"/><use href="#c" x="302" y="450"/><use href="#c" x="372" y="450"/><text x="92" y="506" font-size="12" fill="#5c6872" letter-spacing="1">GST  ·  LEDGER  ·  BANK  ·  MIS  ·  DECISION</text><rect x="1146" y="100" width="386" height="190" fill="#0c1824" stroke="#1e343e"/><text x="1166" y="126" font-size="12" fill="#8c98a0">MSMEs IN INDIA</text><text x="1512" y="126" font-size="12" font-weight="bold" fill="#eeece6" text-anchor="end">7.3 CRORE</text><text x="1166" y="151" font-size="12" fill="#8c98a0">GDP CONTRIBUTION</text><text x="1512" y="151" font-size="12" font-weight="bold" fill="#eeece6" text-anchor="end">~30%</text><text x="1166" y="176" font-size="12" fill="#8c98a0">ON FORMAL BOOKS</text><text x="1512" y="176" font-size="12" font-weight="bold" fill="#eeece6" text-anchor="end">MINORITY</text><text x="1166" y="201" font-size="12" fill="#8c98a0">GET MONTHLY MIS</text><text x="1512" y="201" font-size="12" font-weight="bold" fill="#eeece6" text-anchor="end">FEW</text><text x="1166" y="226" font-size="12" fill="#8c98a0">COMPLIANCE SPEND</text><text x="1512" y="226" font-size="12" font-weight="bold" fill="#eeece6" text-anchor="end">ANNUAL</text><text x="1166" y="251" font-size="12" fill="#8c98a0">INTELLIGENCE SPEND</text><text x="1512" y="251" font-size="12" font-weight="bold" fill="#eeece6" text-anchor="end">~NIL</text><g font-family="Georgia,'Times New Roman',serif" font-weight="bold" font-size="42"><text x="585" y="160" fill="#eeece6">The financial</text><text x="585" y="209" fill="#eeece6">intelligence gap in</text><text x="585" y="258" fill="#eeece6">India's 7.3 crore</text><text x="585" y="307" fill="#d6b06c">MSME sector</text></g><g font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="19" fill="#8c98a0"><text x="585" y="360">Compliance tells you what happened. Intelligence tells you</text><text x="585" y="387">what to do about it. Most MSMEs only ever buy the first.</text></g><path d="M585 422h735" stroke="#1e3038"/><g font-family="Georgia,'Times New Roman',serif"><text x="585" y="468" font-family="'Courier New',Courier,monospace" font-size="15" font-weight="bold" fill="#3aa0a0">01</text><text x="625" y="468" font-size="22" fill="#eeece6">Compliance is bought. Intelligence is not.</text><text x="625" y="496" font-family="'Courier New',Courier,monospace" font-size="13" fill="#5c6872">The same ledger pays for a return and never pays for a decision.</text><text x="585" y="531" font-family="'Courier New',Courier,monospace" font-size="15" font-weight="bold" fill="#3aa0a0">02</text><text x="625" y="531" font-size="22" fill="#eeece6">The data already exists inside the business.</text><text x="625" y="559" font-family="'Courier New',Courier,monospace" font-size="13" fill="#5c6872">GST, Tally and the bank feed hold most of what an MIS needs.</text><text x="585" y="594" font-family="'Courier New',Courier,monospace" font-size="15" font-weight="bold" fill="#3aa0a0">03</text><text x="625" y="594" font-size="22" fill="#eeece6">The CA is closest to the gap, and best placed to close it.</text><text x="625" y="622" font-family="'Courier New',Courier,monospace" font-size="13" fill="#5c6872">Four of the six inputs already sit in the firm's own office.</text></g><text x="1538" y="794" font-family="Georgia,'Times New Roman',serif" font-weight="bold" font-size="200" fill="#111e2a" text-anchor="end">12</text><g font-family="Georgia,'Times New Roman',serif" font-weight="bold" font-size="30"><text x="585" y="694" fill="#eeece6">7.3 CR</text><text x="768" y="694" fill="#eeece6">~30%</text><text x="951" y="694" fill="#eeece6">6</text><text x="1134" y="694" fill="#d6b06c">1</text></g><text x="585" y="728" font-size="12" fill="#5c6872">MSMEs</text><text x="768" y="728" font-size="12" fill="#5c6872">OF GDP</text><text x="951" y="728" font-size="12" fill="#5c6872">DATA SOURCES</text><text x="1134" y="728" font-size="12" fill="#5c6872">GAP TO CLOSE</text><path d="M52 740h1480" stroke="#18282f"/><text x="92" y="770" font-size="14" font-weight="bold" fill="#eeece6" letter-spacing="1">SASIDHARAN</text><text x="215" y="770" font-size="14" fill="#5c6872">·</text><text x="238" y="770" font-size="14" fill="#8c98a0" letter-spacing="1">FOUNDER &amp; CEO, FINLYTTECH</text><text x="1492" y="770" font-size="14" font-weight="bold" fill="#d6b06c" text-anchor="end" letter-spacing="1">FINLYT.NET</text></svg>
