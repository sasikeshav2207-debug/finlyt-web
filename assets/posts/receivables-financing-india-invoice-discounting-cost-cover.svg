<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1584 828" width="1584" height="828" font-family="'Courier New',Courier,monospace"><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#0a1015"/><stop offset="1" stop-color="#07101c"/></linearGradient></defs><rect width="1584" height="828" fill="url(#g)"/><path d="M52 52h26 M52 52v26" stroke="#1e4e54" stroke-width="2"/><path d="M1532 52h-26 M1532 52v26" stroke="#1e4e54" stroke-width="2"/><path d="M52 776h26 M52 776v-26" stroke="#1e4e54" stroke-width="2"/><path d="M1532 776h-26 M1532 776v-26" stroke="#1e4e54" stroke-width="2"/><text x="92" y="82" font-size="15" font-weight="bold" fill="#3aa0a0" letter-spacing="1">FINLYTTECH</text><text x="205" y="82" font-size="15" fill="#5c6872" letter-spacing="1">·  FOUNDER SERIES</text><text x="378" y="82" font-size="15" fill="#5c6872">·</text><text x="390" y="82" font-size="15" font-weight="bold" fill="#d6b06c" letter-spacing="1">ARTICLE 15</text><text x="1492" y="82" font-size="15" font-weight="bold" fill="#3aa0a0" text-anchor="end" letter-spacing="1">FINLYT.NET</text><path d="M52 100h1480" stroke="#18282f"/><defs><g id="c"><rect width="62" height="22" fill="none" stroke="#1e4e54"/><path d="M6 16h42" stroke="#1a3a3e"/></g><rect id="k" width="62" height="22" fill="none" stroke="#d6b06c" stroke-width="2"/></defs><path d="M76 130V472" stroke="#d6b06c" stroke-width="2"/><circle cx="76" cy="132" r="4" fill="#d6b06c"/><use href="#c" x="92" y="130"/><use href="#c" x="232" y="130"/><use href="#c" x="372" y="130"/><use href="#c" x="442" y="130"/><use href="#c" x="512" y="130"/><use href="#c" x="92" y="170"/><use href="#c" x="162" y="170"/><use href="#k" x="232" y="170"/><use href="#c" x="302" y="170"/><use href="#c" x="372" y="170"/><use href="#c" x="442" y="170"/><use href="#c" x="512" y="170"/><use href="#k" x="92" y="210"/><use href="#c" x="162" y="210"/><use href="#c" x="232" y="210"/><use href="#c" x="302" y="210"/><use href="#c" x="512" y="210"/><use href="#c" x="92" y="250"/><use href="#c" x="162" y="250"/><use href="#c" x="232" y="250"/><use href="#c" x="302" y="250"/><use href="#k" x="442" y="250"/><use href="#c" x="512" y="250"/><use href="#c" x="162" y="290"/><use href="#c" x="232" y="290"/><use href="#c" x="302" y="290"/><use href="#c" x="372" y="290"/><use href="#c" x="442" y="290"/><use href="#c" x="512" y="290"/><use href="#c" x="92" y="330"/><use href="#c" x="162" y="330"/><use href="#c" x="232" y="330"/><use href="#c" x="302" y="330"/><use href="#k" x="372" y="330"/><use href="#c" x="232" y="370"/><use href="#c" x="442" y="370"/><use href="#c" x="512" y="370"/><use href="#c" x="92" y="410"/><use href="#c" x="162" y="410"/><use href="#c" x="372" y="410"/><use href="#c" x="442" y="410"/><use href="#c" x="512" y="410"/><use href="#c" x="92" y="450"/><use href="#c" x="162" y="450"/><use href="#c" x="232" y="450"/><use href="#c" x="302" y="450"/><use href="#c" x="442" y="450"/><use href="#c" x="512" y="450"/><text x="92" y="506" font-size="12" fill="#5c6872" letter-spacing="1">INVOICE  ·  TENOR  ·  DISCOUNT  ·  FEES  ·  RECOURSE</text><rect x="1146" y="100" width="386" height="190" fill="#0c1824" stroke="#1e343e"/><text x="1166" y="126" font-size="12" fill="#8c98a0">INVOICE VALUE</text><text x="1512" y="126" font-size="12" font-weight="bold" fill="#eeece6" text-anchor="end">Rs.50 LAKH</text><text x="1166" y="151" font-size="12" fill="#8c98a0">TENOR</text><text x="1512" y="151" font-size="12" font-weight="bold" fill="#eeece6" text-anchor="end">60 DAYS</text><text x="1166" y="176" font-size="12" fill="#8c98a0">TReDS ALL-IN</text><text x="1512" y="176" font-size="12" font-weight="bold" fill="#eeece6" text-anchor="end">9.9% p.a.</text><text x="1166" y="201" font-size="12" fill="#8c98a0">NBFC ALL-IN</text><text x="1512" y="201" font-size="12" font-weight="bold" fill="#eeece6" text-anchor="end">21.1% p.a.</text><text x="1166" y="226" font-size="12" fill="#8c98a0">HEADLINE GAP</text><text x="1512" y="226" font-size="12" font-weight="bold" fill="#eeece6" text-anchor="end">5.8 PTS</text><text x="1166" y="251" font-size="12" fill="#8c98a0">ACTUAL GAP</text><text x="1512" y="251" font-size="12" font-weight="bold" fill="#eeece6" text-anchor="end">11.2 PTS</text><g font-family="Georgia,'Times New Roman',serif" font-weight="bold" font-size="41"><text x="585" y="159" fill="#eeece6">Receivables financing</text><text x="585" y="207" fill="#eeece6">in India: what invoice</text><text x="585" y="255" fill="#eeece6">discounting really</text><text x="585" y="303" fill="#d6b06c">costs an SME</text></g><g font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="19" fill="#8c98a0"><text x="585" y="355">The headline rate is never the price. On a 60-day bill, every</text><text x="585" y="382">1% of upfront fee adds six points to what you actually pay.</text></g><path d="M585 417h735" stroke="#1e3038"/><g font-family="Georgia,'Times New Roman',serif"><text x="585" y="463" font-family="'Courier New',Courier,monospace" font-size="15" font-weight="bold" fill="#3aa0a0">01</text><text x="625" y="463" font-size="22" fill="#eeece6">The quoted rate is not the all-in cost.</text><text x="625" y="491" font-family="'Courier New',Courier,monospace" font-size="13" fill="#5c6872">Rs.50L for 60 days: 9.9% on TReDS, 21.1% off-platform. Same invoice.</text><text x="585" y="526" font-family="'Courier New',Courier,monospace" font-size="15" font-weight="bold" fill="#3aa0a0">02</text><text x="625" y="526" font-size="22" fill="#eeece6">Recourse decides whether it is a sale or a loan.</text><text x="625" y="554" font-family="'Courier New',Courier,monospace" font-size="13" fill="#5c6872">Without recourse the receivable leaves your books. With it, that is debt.</text><text x="585" y="589" font-family="'Courier New',Courier,monospace" font-size="15" font-weight="bold" fill="#3aa0a0">03</text><text x="625" y="589" font-size="22" fill="#eeece6">Price it against the cash cycle, not the CC rate.</text><text x="625" y="617" font-family="'Courier New',Courier,monospace" font-size="13" fill="#5c6872">Collecting in 45 days instead of 75 does the same job and costs nothing.</text></g><text x="1538" y="794" font-family="Georgia,'Times New Roman',serif" font-weight="bold" font-size="200" fill="#111e2a" text-anchor="end">15</text><g font-family="Georgia,'Times New Roman',serif" font-weight="bold" font-size="30"><text x="585" y="694" fill="#eeece6">60</text><text x="768" y="694" fill="#eeece6">9.9%</text><text x="951" y="694" fill="#eeece6">21.1%</text><text x="1134" y="694" fill="#d6b06c">11.2</text></g><text x="585" y="728" font-size="12" fill="#5c6872">DAY TENOR</text><text x="768" y="728" font-size="12" fill="#5c6872">TReDS ALL-IN</text><text x="951" y="728" font-size="12" fill="#5c6872">NBFC ALL-IN</text><text x="1134" y="728" font-size="12" fill="#5c6872">POINT GAP</text><path d="M52 740h1480" stroke="#18282f"/><text x="92" y="770" font-size="14" font-weight="bold" fill="#eeece6" letter-spacing="1">SASIDHARAN</text><text x="215" y="770" font-size="14" fill="#5c6872">·</text><text x="238" y="770" font-size="14" fill="#8c98a0" letter-spacing="1">FOUNDER &amp; CEO, FINLYTTECH</text><text x="1492" y="770" font-size="14" font-weight="bold" fill="#d6b06c" text-anchor="end" letter-spacing="1">FINLYT.NET</text></svg>
