="162" y="250"/><use href="#c" x="232" y="250"/><use href="#c" x="302" y="250"/><use href="#c" x="372" y="250"/><use href="#k" x="442" y="250"/><use href="#c" x="512" y="250"/><use href="#c" x="92" y="290"/><use href="#c" x="372" y="290"/><use href="#c" x="442" y="290"/><use href="#c" x="92" y="330"/><use href="#c" x="162" y="330"/><use href="#c" x="302" y="330"/><use href="#c" x="512" y="330"/><use href="#c" x="162" y="370"/><use href="#c" x="232" y="370"/><use href="#c" x="302" y="370"/><use href="#c" x="372" y="370"/><use href="#c" x="442" y="370"/><use href="#c" x="512" y="370"/><use href="#c" x="92" y="410"/><use href="#c" x="162" y="410"/><use href="#c" x="232" y="410"/><use href="#c" x="302" y="410"/><use href="#c" x="442" y="410"/><use href="#c" x="162" y="450"/><use href="#c" x="232" y="450"/><use href="#c" x="302" y="450"/><use href="#c" x="442" y="450"/><use href="#c" x="512" y="450"/><text x="92" y="506" font-size="12" fill="#5c6872" letter-spacing="1">CUT-OFF  ·  RECONCILE  ·  ACCRUE  ·  REVIEW  ·  REPORT</text><rect x="1146" y="100" width="386" height="190" fill="#0c1824" stroke="#1e343e"/><text x="1166" y="126" font-size="12" fill="#8c98a0">TYPICAL CLOSE</text><text x="1512" y="126" font-size="12" font-weight="bold" fill="#eeece6" text-anchor="end">15-25 DAYS</text><text x="1166" y="151" font-size="12" fill="#8c98a0">TARGET CLOSE</text><text x="1512" y="151" font-size="12" font-weight="bold" fill="#eeece6" text-anchor="end">5 DAYS</text><text x="1166" y="176" font-size="12" fill="#8c98a0">RECONCILIATIONS</text><text x="1512" y="176" font-size="12" font-weight="bold" fill="#eeece6" text-anchor="end">3</text><text x="1166" y="201" font-size="12" fill="#8c98a0">CUT-OFF DECISIONS</text><text x="1512" y="201" font-size="12" font-weight="bold" fill="#eeece6" text-anchor="end">1</text><text x="1166" y="226" font-size="12" fill="#8c98a0">WORK THAT CAN PRE-RUN</text><text x="1512" y="226" font-size="12" font-weight="bold" fill="#eeece6" text-anchor="end">MOST</text><text x="1166" y="251" font-size="12" fill="#8c98a0">DECISION WINDOW</text><text x="1512" y="251" font-size="12" font-weight="bold" fill="#eeece6" text-anchor="end">REGAINED</text><g font-family="Georgia,'Times New Roman',serif" font-weight="bold" font-size="40"><text x="585" y="158" fill="#eeece6">The monthly close:</text><text x="585" y="205" fill="#eeece6">how a 15-day close</text><text x="585" y="252" fill="#eeece6">becomes a 5-day close</text><text x="585" y="299" fill="#d6b06c">for an Indian SME</text></g><g font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="19" fill="#8c98a0"><text x="585" y="350">A close is one cut-off decision, three reconciliations and a</text><text x="585" y="377">judgment call -- and only the judgment call has to wait.</text></g><path d="M585 412h735" stroke="#1e3038"/><g font-family="Georgia,'Times New Roman',serif"><text x="585" y="458" font-family="'Courier New',Courier,monospace" font-size="15" font-weight="bold" fill="#3aa0a0">01</text><text x="625" y="458" font-size="22" fill="#eeece6">The close takes 15 days because it is built to.</text><text x="625" y="486" font-family="'Courier New',Courier,monospace" font-size="13" fill="#5c6872">Nobody in the chain is doing anything wrong. The sequence is.</text><text x="585" y="521" font-family="'Courier New',Courier,monospace" font-size="15" font-weight="bold" fill="#3aa0a0">02</text><text x="625" y="521" font-size="22" fill="#eeece6">Most of the work does not need month-end.</text><text x="625" y="549" font-family="'Courier New',Courier,monospace" font-size="13" fill="#5c6872">Reconcile weekly and only the true cut-off items remain.</text><text x="585" y="584" font-family="'Courier New',Courier,monospace" font-size="15" font-weight="bold" fill="#3aa0a0">03</text><text x="625" y="584" font-size="22" fill="#eeece6">A late number is a number you cannot act on.</text><text x="625" y="612" font-family="'Courier New',Courier,monospace" font-size="13" fill="#5c6872">By the time August arrives, September is two-thirds spent.</text></g><text x="1538" y="794" font-family="Georgia,'Times New Roman',serif" font-weight="bold" font-size="200" fill="#111e2a" text-anchor="end">13</text><g font-family="Georgia,'Times New Roman',serif" font-weight="bold" font-size="30"><text x="585" y="694" fill="#eeece6">15</text><text x="768" y="694" fill="#eeece6">5</text><text x="951" y="694" fill="#eeece6">3</text><text x="1134" y="694" fill="#d6b06c">10</text></g><text x="585" y="728" font-size="12" fill="#5c6872">DAYS TODAY</text><text x="768" y="728" font-size="12" fill="#5c6872">DAYS ACHIEVABLE</text><text x="951" y="728" font-size="12" fill="#5c6872">RECONCILIATIONS</text><text x="1134" y="728" font-size="12" fill="#5c6872">DAYS BACK</text><path d="M52 740h1480" stroke="#18282f"/><text x="92" y="770" font-size="14" font-weight="bold" fill="#eeece6" letter-spacing="1">SASIDHARAN</text><text x="215" y="770" font-size="14" fill="#5c6872">·</text><text x="238" y="770" font-size="14" fill="#8c98a0" letter-spacing="1">FOUNDER &amp; CEO, FINLYTTECH</text><text x="1492" y="770" font-size="14" font-weight="bold" fill="#d6b06c" text-anchor="end" letter-spacing="1">FINLYT.NET</text></svg>
