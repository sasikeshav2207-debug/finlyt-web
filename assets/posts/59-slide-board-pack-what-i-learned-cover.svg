<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1584 828" width="1584" height="828" font-family="'Courier New',Courier,monospace"><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#0a1015"/><stop offset="1" stop-color="#07101c"/></linearGradient></defs><rect width="1584" height="828" fill="url(#g)"/><path d="M52 52h26 M52 52v26" stroke="#1e4e54" stroke-width="2"/><path d="M1532 52h-26 M1532 52v26" stroke="#1e4e54" stroke-width="2"/><path d="M52 776h26 M52 776v-26" stroke="#1e4e54" stroke-width="2"/><path d="M1532 776h-26 M1532 776v-26" stroke="#1e4e54" stroke-width="2"/><text x="92" y="82" font-size="15" font-weight="bold" fill="#3aa0a0" letter-spacing="1">FINLYTTECH</text><text x="205" y="82" font-size="15" fill="#5c6872" letter-spacing="1">·  FOUNDER SERIES</text><text x="1492" y="82" font-size="15" font-weight="bold" fill="#3aa0a0" text-anchor="end" letter-spacing="1">FINLYT.NET</text><path d="M52 100h1480" stroke="#18282f"/><defs><g id="c"><rect width="62" height="22" fill="none" stroke="#1e4e54"/><path d="M6 16h42" stroke="#1a3a3e"/></g><rect id="k" width="62" height="22" fill="none" stroke="#d6b06c" stroke-width="2"/></defs><path d="M76 130V472" stroke="#d6b06c" stroke-width="2"/><circle cx="76" cy="132" r="4" fill="#d6b06c"/><use href="#c" x="162" y="130"/><use href="#c" x="232" y="130"/><use href="#c" x="442" y="130"/><use href="#c" x="512" y="130"/><use href="#c" x="92" y="170"/><use href="#c" x="162" y="170"/><use href="#k" x="232" y="170"/><use href="#c" x="372" y="170"/><use href="#c" x="442" y="170"/><use href="#k" x="92" y="210"/><use href="#c" x="162" y="210"/><use href="#c" x="232" y="210"/><use href="#c" x="372" y="210"/><use href="#c" x="442" y="210"/><use href="#c" x="92" y="250"/><use href="#c" x="162" y="250"/><use href="#c" x="302" y="250"/><use href="#c" x="372" y="250"/><use href="#k" x="442" y="250"/><use href="#c" x="512" y="250"/><use href="#c" x="92" y="290"/><use href="#c" x="162" y="290"/><use href="#c" x="232" y="290"/><use href="#c" x="372" y="290"/><use href="#c" x="92" y="330"/><use href="#c" x="232" y="330"/><use href="#c" x="442" y="330"/><use href="#c" x="512" y="330"/><use href="#c" x="92" y="370"/><use href="#c" x="162" y="370"/><use href="#c" x="232" y="370"/><use href="#c" x="302" y="370"/><use href="#c" x="372" y="370"/><use href="#c" x="442" y="370"/><use href="#c" x="512" y="370"/><use href="#c" x="162" y="410"/><use href="#c" x="302" y="410"/><use href="#c" x="512" y="410"/><use href="#c" x="92" y="450"/><use href="#c" x="232" y="450"/><use href="#c" x="302" y="450"/><use href="#c" x="372" y="450"/><use href="#c" x="442" y="450"/><use href="#c" x="512" y="450"/><text x="92" y="506" font-size="12" fill="#5c6872" letter-spacing="1">EXTRACT  ·  MAP  ·  CHART  ·  ASSEMBLE  ·  COMMENT</text><rect x="1146" y="100" width="386" height="190" fill="#0c1824" stroke="#1e343e"/><text x="1166" y="126" font-size="12" fill="#8c98a0">SLIDES IN THE PACK</text><text x="1512" y="126" font-size="12" font-weight="bold" fill="#eeece6" text-anchor="end">59</text><text x="1166" y="151" font-size="12" fill="#8c98a0">BUILT BY HAND</text><text x="1512" y="151" font-size="12" font-weight="bold" fill="#eeece6" text-anchor="end">ALL</text><text x="1166" y="176" font-size="12" fill="#8c98a0">TRUE ANALYSIS</text><text x="1512" y="176" font-size="12" font-weight="bold" fill="#eeece6" text-anchor="end">A FEW</text><text x="1166" y="201" font-size="12" fill="#8c98a0">REST</text><text x="1512" y="201" font-size="12" font-weight="bold" fill="#eeece6" text-anchor="end">ASSEMBLY</text><text x="1166" y="226" font-size="12" fill="#8c98a0">REBUILT EVERY MONTH</text><text x="1512" y="226" font-size="12" font-weight="bold" fill="#eeece6" text-anchor="end">YES</text><text x="1166" y="251" font-size="12" fill="#8c98a0">LESSON</text><text x="1512" y="251" font-size="12" font-weight="bold" fill="#eeece6" text-anchor="end">SEPARATE THEM</text><g font-family="Georgia,'Times New Roman',serif" font-weight="bold" font-size="34"><text x="585" y="152" fill="#eeece6">I built a 59-slide</text><text x="585" y="192" fill="#eeece6">board pack for a</text><text x="585" y="232" fill="#eeece6">hospital network by hand.</text><text x="585" y="272" fill="#d6b06c">Here is what I learned.</text></g><g font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="19" fill="#8c98a0"><text x="585" y="316">Most of those 59 slides were not analysis. They were assembly --</text><text x="585" y="343">and assembly is the part that never needed a human.</text></g><path d="M585 378h735" stroke="#1e3038"/><g font-family="Georgia,'Times New Roman',serif"><text x="585" y="424" font-family="'Courier New',Courier,monospace" font-size="15" font-weight="bold" fill="#3aa0a0">01</text><text x="625" y="424" font-size="22" fill="#eeece6">Assembly and analysis are different jobs.</text><text x="625" y="452" font-family="'Courier New',Courier,monospace" font-size="13" fill="#5c6872">One is repetitive and mechanical. One is why you were hired.</text><text x="585" y="487" font-family="'Courier New',Courier,monospace" font-size="15" font-weight="bold" fill="#3aa0a0">02</text><text x="625" y="487" font-size="22" fill="#eeece6">The pack is rebuilt from scratch every cycle.</text><text x="625" y="515" font-family="'Courier New',Courier,monospace" font-size="13" fill="#5c6872">Same structure, same mappings, same month-end scramble.</text><text x="585" y="550" font-family="'Courier New',Courier,monospace" font-size="15" font-weight="bold" fill="#3aa0a0">03</text><text x="625" y="550" font-size="22" fill="#eeece6">Standardise the structure, free the judgment.</text><text x="625" y="578" font-family="'Courier New',Courier,monospace" font-size="13" fill="#5c6872">Fix the template once and the commentary gets the time it deserves.</text></g><g font-family="Georgia,'Times New Roman',serif" font-weight="bold" font-size="30"><text x="585" y="694" fill="#eeece6">59</text><text x="768" y="694" fill="#eeece6">12</text><text x="951" y="694" fill="#eeece6">2</text><text x="1134" y="694" fill="#d6b06c">1</text></g><text x="585" y="728" font-size="12" fill="#5c6872">SLIDES</text><text x="768" y="728" font-size="12" fill="#5c6872">REBUILDS A YEAR</text><text x="951" y="728" font-size="12" fill="#5c6872">JOBS IN ONE</text><text x="1134" y="728" font-size="12" fill="#5c6872">LESSON</text><path d="M52 740h1480" stroke="#18282f"/><text x="92" y="770" font-size="14" font-weight="bold" fill="#eeece6" letter-spacing="1">SASIDHARAN</text><text x="215" y="770" font-size="14" fill="#5c6872">·</text><text x="238" y="770" font-size="14" fill="#8c98a0" letter-spacing="1">FOUNDER &amp; CEO, FINLYTTECH</text><text x="1492" y="770" font-size="14" font-weight="bold" fill="#d6b06c" text-anchor="end" letter-spacing="1">FINLYT.NET</text></svg>
