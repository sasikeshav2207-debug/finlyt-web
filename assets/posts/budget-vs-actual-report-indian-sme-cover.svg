<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1584 828" width="1584" height="828" font-family="'Courier New',Courier,monospace"><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#0a1015"/><stop offset="1" stop-color="#07101c"/></linearGradient></defs><rect width="1584" height="828" fill="url(#g)"/><path d="M52 52h26 M52 52v26" stroke="#1e4e54" stroke-width="2"/><path d="M1532 52h-26 M1532 52v26" stroke="#1e4e54" stroke-width="2"/><path d="M52 776h26 M52 776v-26" stroke="#1e4e54" stroke-width="2"/><path d="M1532 776h-26 M1532 776v-26" stroke="#1e4e54" stroke-width="2"/><text x="92" y="82" font-size="15" font-weight="bold" fill="#3aa0a0" letter-spacing="1">FINLYTTECH</text><text x="205" y="82" font-size="15" fill="#5c6872" letter-spacing="1">·  FOUNDER SERIES</text><text x="378" y="82" font-size="15" fill="#5c6872">·</text><text x="390" y="82" font-size="15" font-weight="bold" fill="#d6b06c" letter-spacing="1">ARTICLE 16</text><text x="1492" y="82" font-size="15" font-weight="bold" fill="#3aa0a0" text-anchor="end" letter-spacing="1">FINLYT.NET</text><path d="M52 100h1480" stroke="#18282f"/><defs><g id="c"><rect width="62" height="22" fill="none" stroke="#1e4e54"/><path d="M6 16h42" stroke="#1a3a3e"/></g><rect id="k" width="62" height="22" fill="none" stroke="#d6b06c" stroke-width="2"/></defs><path d="M76 130V472" stroke="#d6b06c" stroke-width="2"/><circle cx="76" cy="132" r="4" fill="#d6b06c"/><use href="#c" x="92" y="130"/><use href="#c" x="162" y="130"/><use href="#c" x="442" y="130"/><use href="#c" x="512" y="130"/><use href="#k" x="232" y="170"/><use href="#c" x="442" y="170"/><use href="#c" x="512" y="170"/><use href="#k" x="92" y="210"/><use href="#c" x="302" y="210"/><use href="#c" x="372" y="210"/><use href="#c" x="512" y="210"/><use href="#c" x="92" y="250"/><use href="#c" x="232" y="250"/><use href="#c" x="372" y="250"/><use href="#k" x="442" y="250"/><use href="#c" x="512" y="250"/><use href="#c" x="92" y="290"/><use href="#c" x="162" y="290"/><use href="#c" x="302" y="290"/><use href="#c" x="512" y="290"/><use href="#c" x="162" y="330"/><use href="#k" x="372" y="330"/><use href="#c" x="442" y="330"/><use href="#c" x="512" y="330"/><use href="#c" x="92" y="370"/><use href="#c" x="232" y="370"/><use href="#c" x="512" y="370"/><use href="#c" x="92" y="410"/><use href="#c" x="302" y="410"/><use href="#c" x="442" y="410"/><use href="#c" x="512" y="410"/><use href="#c" x="92" y="450"/><use href="#c" x="162" y="450"/><use href="#c" x="232" y="450"/><text x="92" y="506" font-size="12" fill="#5c6872" letter-spacing="1">BUDGET  ·  MAP  ·  PHASE  ·  VARIANCE  ·  EXPLAIN</text><rect x="1146" y="100" width="386" height="190" fill="#0c1824" stroke="#1e343e"/><text x="1166" y="126" font-size="12" fill="#8c98a0">BUDGET LIVES IN</text><text x="1512" y="126" font-size="12" font-weight="bold" fill="#eeece6" text-anchor="end">EXCEL</text><text x="1166" y="151" font-size="12" fill="#8c98a0">ACTUALS LIVE IN</text><text x="1512" y="151" font-size="12" font-weight="bold" fill="#eeece6" text-anchor="end">TALLY</text><text x="1166" y="176" font-size="12" fill="#8c98a0">MAPPING DONE</text><text x="1512" y="176" font-size="12" font-weight="bold" fill="#eeece6" text-anchor="end">RARELY</text><text x="1166" y="201" font-size="12" fill="#8c98a0">PHASING METHOD</text><text x="1512" y="201" font-size="12" font-weight="bold" fill="#eeece6" text-anchor="end">ANNUAL/12</text><text x="1166" y="226" font-size="12" fill="#8c98a0">MATERIALITY RULE</text><text x="1512" y="226" font-size="12" font-weight="bold" fill="#eeece6" text-anchor="end">10% + Rs.</text><text x="1166" y="251" font-size="12" fill="#8c98a0">REPORTS PRODUCED</text><text x="1512" y="251" font-size="12" font-weight="bold" fill="#eeece6" text-anchor="end">ZERO</text><g font-family="Georgia,'Times New Roman',serif" font-weight="bold" font-size="39"><text x="585" y="157" fill="#eeece6">Budget vs actual:</text><text x="585" y="203" fill="#eeece6">the report most Indian</text><text x="585" y="249" fill="#eeece6">SMEs have never once</text><text x="585" y="295" fill="#d6b06c">produced</text></g><g font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="19" fill="#8c98a0"><text x="585" y="345">A budget in a slide and actuals in Tally are not a variance</text><text x="585" y="372">report. Nothing happens until the two sit in adjacent columns.</text></g><path d="M585 407h735" stroke="#1e3038"/><g font-family="Georgia,'Times New Roman',serif"><text x="585" y="453" font-family="'Courier New',Courier,monospace" font-size="15" font-weight="bold" fill="#3aa0a0">01</text><text x="625" y="453" font-size="22" fill="#eeece6">The budget and the ledger speak different languages.</text><text x="625" y="481" font-family="'Courier New',Courier,monospace" font-size="13" fill="#5c6872">One marketing line in the plan is four ledgers in the books.</text><text x="585" y="516" font-family="'Courier New',Courier,monospace" font-size="15" font-weight="bold" fill="#3aa0a0">02</text><text x="625" y="516" font-size="22" fill="#eeece6">Annual divided by twelve is twelve wrong budgets.</text><text x="625" y="544" font-family="'Courier New',Courier,monospace" font-size="13" fill="#5c6872">October is not a twelfth of a festive-season year.</text><text x="585" y="579" font-family="'Courier New',Courier,monospace" font-size="15" font-weight="bold" fill="#3aa0a0">03</text><text x="625" y="579" font-size="22" fill="#eeece6">The column that changes behaviour is a sentence.</text><text x="625" y="607" font-family="'Courier New',Courier,monospace" font-size="13" fill="#5c6872">'22% over' is a fact. 'Because we air-freighted two orders' is a decision.</text></g><text x="1538" y="794" font-family="Georgia,'Times New Roman',serif" font-weight="bold" font-size="200" fill="#111e2a" text-anchor="end">16</text><g font-family="Georgia,'Times New Roman',serif" font-weight="bold" font-size="30"><text x="585" y="694" fill="#eeece6">2</text><text x="768" y="694" fill="#eeece6">12</text><text x="951" y="694" fill="#eeece6">10%</text><text x="1134" y="694" fill="#d6b06c">1</text></g><text x="585" y="728" font-size="12" fill="#5c6872">SYSTEMS TO MAP</text><text x="768" y="728" font-size="12" fill="#5c6872">MONTHS TO PHASE</text><text x="951" y="728" font-size="12" fill="#5c6872">MATERIALITY FLAG</text><text x="1134" y="728" font-size="12" fill="#5c6872">PAGE</text><path d="M52 740h1480" stroke="#18282f"/><text x="92" y="770" font-size="14" font-weight="bold" fill="#eeece6" letter-spacing="1">SASIDHARAN</text><text x="215" y="770" font-size="14" fill="#5c6872">·</text><text x="238" y="770" font-size="14" fill="#8c98a0" letter-spacing="1">FOUNDER &amp; CEO, FINLYTTECH</text><text x="1492" y="770" font-size="14" font-weight="bold" fill="#d6b06c" text-anchor="end" letter-spacing="1">FINLYT.NET</text></svg>
