<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>FinLytTech logo mark</title>
  <defs>
    <radialGradient id="crystalGrad" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#A8F0D8"/>
      <stop offset="40%" stop-color="#1DCBA0"/>
      <stop offset="100%" stop-color="#0A7A5E"/>
    </radialGradient>
    <linearGradient id="helixGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1DCBA0"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
    <linearGradient id="helixGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0891B2"/>
      <stop offset="100%" stop-color="#1D9E75"/>
    </linearGradient>
  </defs>
  <g transform="translate(60,60)">
    <!-- Strand 1 -->
    <path d="M-18,-38 C-28,-20 -28,0 -18,18 C-8,36 8,46 8,60" fill="none" stroke="url(#helixGrad1)" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Strand 2 -->
    <path d="M18,-38 C28,-20 28,0 18,18 C8,36 -8,46 -8,60" fill="none" stroke="url(#helixGrad2)" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Cross rungs -->
    <line x1="-16" y1="-28" x2="16" y2="-28" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
    <line x1="-22" y1="-14" x2="22" y2="-14" stroke="#0891B2" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="-24" y1="0" x2="24" y2="0" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
    <line x1="-22" y1="14" x2="22" y2="14" stroke="#0891B2" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <!-- Circuit nodes -->
    <circle cx="-18" cy="-38" r="2.5" fill="#1DCBA0"/>
    <circle cx="-24" cy="-7" r="2" fill="#0891B2" opacity="0.8"/>
    <circle cx="-18" cy="18" r="2.5" fill="#1DCBA0"/>
    <circle cx="8" cy="60" r="2" fill="#1D9E75" opacity="0.8"/>
    <circle cx="18" cy="-38" r="2.5" fill="#0891B2"/>
    <circle cx="24" cy="-7" r="2" fill="#1D9E75" opacity="0.8"/>
    <circle cx="18" cy="18" r="2.5" fill="#0891B2"/>
    <circle cx="-8" cy="60" r="2" fill="#1DCBA0" opacity="0.8"/>
    <!-- Crystal gem -->
    <polygon points="0,-18 14,-6 10,8 -10,8 -14,-6" fill="url(#crystalGrad)" opacity="0.95"/>
    <polygon points="0,-18 14,-6 0,-2" fill="#A8F0D8" opacity="0.5"/>
    <polygon points="0,-18 -14,-6 0,-2" fill="#E0FFF5" opacity="0.3"/>
    <polygon points="-14,-6 -10,8 0,2" fill="#1DCBA0" opacity="0.4"/>
    <polygon points="14,-6 10,8 0,2" fill="#0891B2" opacity="0.35"/>
    <polygon points="0,-18 14,-6 10,8 -10,8 -14,-6" fill="none" stroke="#A8F0D8" stroke-width="0.8" opacity="0.8"/>
    <circle cx="0" cy="-4" r="2.5" fill="#E0FFF5" opacity="0.9"/>
    <circle cx="0" cy="-4" r="1.2" fill="white" opacity="0.95"/>
  </g>
</svg>
