# Render static-site mirror of finlyt.net.
# finlyt.net itself is served by GitHub Pages (see CNAME); this exists so the
# same build can be published to Render without further setup.
services:
  - type: web
    name: finlyt-web
    runtime: static
    buildCommand: bundle install && bundle exec jekyll build
    staticPublishPath: ./_site
    pullRequestPreviewsEnabled: true
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
