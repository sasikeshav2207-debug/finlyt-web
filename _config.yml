# Jekyll site configuration. GitHub Pages reads this file and builds the site
# automatically on every push to `main`. Existing HTML files (index.html,
# privacy.html, terms.html) have no front-matter, so Jekyll copies them through
# unchanged — only blog content under `_posts/` and pages with front-matter are
# rendered. So adding a blog is purely additive.

title: Finlyt
tagline: Financial intelligence for Indian businesses
description: >-
  AI-powered MIS, cash flow forecasting and real-time insights for Indian
  startups, SMEs and chartered accountants — built in India for India.
url: https://finlyt.net
# Repo-wide branding used by the SEO plugin + post layouts.
author:
  name: Finlyt
  email: founder@finlyt.net
  twitter: ""
social:
  name: Finlyt
  links:
    - https://www.linkedin.com/company/finlyt-tech
logo: /assets/founder.jpg   # placeholder until a logo file is added
# Default Open Graph image for posts that don't set one.
og_image: /assets/og-default.png

# ---- Blog URLs ----
# /blog/<slug>/ keeps URLs short and SEO-friendly; the date stays in the post
# meta but doesn't clutter the URL or block re-using a slug across years.
permalink: /blog/:slug/

# ---- Plugins ----
# All three are on GitHub Pages' default allow-list — no Gemfile needed.
# seo-tag : <title>, meta description, Open Graph, Twitter card, JSON-LD.
# sitemap : auto-generates /sitemap.xml (submit to Google Search Console).
# feed    : auto-generates /feed.xml (RSS) so readers + aggregators can subscribe.
# (Pagination intentionally NOT enabled — jekyll-paginate v1 only paginates
# the root index.html, which is the landing page. We'll add pagination when the
# blog has enough posts to warrant it, via a GitHub Actions Pages workflow.)
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

# ---- What Jekyll should leave alone ----
# Build artefacts + tooling that should never ship to /.
exclude:
  - deploy.bat
  - vercel.json
  - render.yaml
  - LANDING_CHANGES_2026_06_07.md
  - README.md
  - BLOG_POSTING_GUIDE.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - .jekyll-cache

# ---- Markdown ----
markdown: kramdown
kramdown:
  input: GFM                # GitHub-flavoured Markdown (tables, fenced code, etc.)
  syntax_highlighter: rouge

# ---- Defaults applied to every post ----
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: Finlyt
